databaseChangeLog:
  - changeSet:
      id: 001_create_notifications.yaml
      author: kirill25
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(20)

              - column:
                  name: channel
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: recipient_email
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: subject
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: retry_count
                  type: integer

              - column:
                  name: sent_at
                  type: timestamp

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_notifications_user_id
            tableName: notifications
            columns:
              - column:
                  name: user_id